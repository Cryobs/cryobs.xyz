services:
  nginx:
    build: .
    container_name: cryobs-website
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - default
      - cloudflare-net
    volumes:
      - ./src:/usr/share/nginx/html:ro

networks:
  default:
    driver: bridge
  cloudflare-net:
    external: true
